server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Extensionless URLs resolve to their .html file, so both /studio-intro
    # and /studio-intro.html work.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Parcel emits a flat dist/ where every asset filename carries a content
    # hash (app.d433b995.js, streets-of-rage-2-3-cyr.c699644c.woff2), so these
    # can be cached forever - a change produces a new filename.
    location ~* \.(js|css|woff2?|ttf|otf|eot|png|jpe?g|gif|webp|avif|svg|ico|mp3|wav|mp4|webm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML is NOT hashed - always revalidate so a rebuild is picked up.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    # Deliberately no video/image types here - mp4, gif, png and woff2 are
    # already compressed, so gzipping them only burns CPU.
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # nginx serves byte-range requests by default, which the 28 MB of video
    # under /assets/videos/ relies on for seeking.
}
